<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ArchDistribution processing and evidence flow</title>
  <desc id="description">Six-stage workflow from role-assigned heritage layers through metric processing, indexed candidate generation, versioned rules and human review, distinct identifiers and typed relations, to geometry-family outputs, a printable map, an audit table, and a reproducibility manifest.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#263238"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .card { fill: #f3f5f6; stroke: #263238; stroke-width: 2; }
      .card-output { fill: #e9f2f7; stroke: #263238; stroke-width: 2; }
      .step { fill: #005b96; stroke: #ffffff; stroke-width: 2; }
      .step-text { fill: #ffffff; font: 700 22px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .heading { fill: #102027; font: 700 21px Arial, Helvetica, sans-serif; }
      .body { fill: #263238; font: 20px Arial, Helvetica, sans-serif; }
      .key { fill: #263238; font: 700 19px Consolas, "Liberation Mono", monospace; }
      .relation { fill: #263238; font: 19px Arial, Helvetica, sans-serif; }
      .eyebrow { fill: #005b96; font: 700 19px Arial, Helvetica, sans-serif; letter-spacing: 0.35px; }
      .title { fill: #102027; font: 700 32px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #37474f; font: 20px Arial, Helvetica, sans-serif; }
      .arrow { fill: none; stroke: #263238; stroke-width: 4; marker-end: url(#arrow); }
      .divider { stroke: #78909c; stroke-width: 1.5; }
      .footer { fill: #ffffff; stroke: #005b96; stroke-width: 2; stroke-dasharray: 8 5; }
      .footer-text { fill: #102027; font: 700 18px Arial, Helvetica, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1200" height="800"/>
  <text class="title" x="48" y="48">ArchDistribution: processing and evidence flow</text>
  <text class="subtitle" x="48" y="80">Spatial evidence proposes candidates; versioned rules and human review determine map numbers.</text>

  <!-- Top row: collection and candidate generation -->
  <g id="stage-1">
    <rect class="card" x="35" y="110" width="340" height="250" rx="8"/>
    <circle class="step" cx="67" cy="145" r="22"/>
    <text class="step-text" x="67" y="146">1</text>
    <text class="heading" x="101" y="153">Role-assigned data</text>
    <line class="divider" x1="57" y1="176" x2="353" y2="176"/>
    <text class="body" x="61" y="210">• designated / registered</text>
    <text class="body" x="61" y="242">• protection boundary</text>
    <text class="body" x="61" y="274">• distribution map</text>
    <text class="body" x="61" y="306">• survey / excavation</text>
    <text class="eyebrow" x="61" y="340">SOURCE DATA RETAINED</text>
  </g>

  <path class="arrow" d="M 387 235 H 416"/>

  <g id="stage-2">
    <rect class="card" x="430" y="110" width="340" height="250" rx="8"/>
    <circle class="step" cx="462" cy="145" r="22"/>
    <text class="step-text" x="462" y="146">2</text>
    <text class="heading" x="496" y="153">Metric context</text>
    <line class="divider" x1="452" y1="176" x2="748" y2="176"/>
    <text class="body" x="456" y="212">source → analysis → output</text>
    <text class="body" x="456" y="252">extent prefilter</text>
    <text class="body" x="456" y="292">encoding + geometry repair</text>
    <text class="eyebrow" x="456" y="340">MEASUREMENTS IN METRES</text>
  </g>

  <path class="arrow" d="M 782 235 H 811"/>

  <g id="stage-3">
    <rect class="card" x="825" y="110" width="340" height="250" rx="8"/>
    <circle class="step" cx="857" cy="145" r="22"/>
    <text class="step-text" x="857" y="146">3</text>
    <text class="heading" x="891" y="153">Indexed candidates</text>
    <line class="divider" x1="847" y1="176" x2="1143" y2="176"/>
    <text class="body" x="851" y="212">QgsSpatialIndex</text>
    <text class="body" x="851" y="252">name + spatial evidence</text>
    <text class="body" x="851" y="292">bounded local comparison</text>
    <text class="eyebrow" x="851" y="340">NO ALL-PAIRS SCAN</text>
  </g>

  <path class="arrow" d="M 995 372 V 421"/>

  <!-- Bottom row runs right to left: decisions, meaning, outputs -->
  <g id="stage-4">
    <rect class="card" x="825" y="435" width="340" height="250" rx="8"/>
    <circle class="step" cx="857" cy="470" r="22"/>
    <text class="step-text" x="857" y="471">4</text>
    <text class="heading" x="891" y="478">Rules + review</text>
    <line class="divider" x1="847" y1="501" x2="1143" y2="501"/>
    <text class="body" x="851" y="540">ruleset + SHA-256</text>
    <text class="body" x="851" y="580">reviewable suggestions</text>
    <text class="body" x="851" y="620">keep / link / share</text>
    <text class="eyebrow" x="851" y="662">HUMAN DECISION RECORDED</text>
  </g>

  <path class="arrow" d="M 813 560 H 782"/>

  <g id="stage-5">
    <rect class="card" x="430" y="435" width="340" height="250" rx="8"/>
    <circle class="step" cx="462" cy="470" r="22"/>
    <text class="step-text" x="462" y="471">5</text>
    <text class="heading" x="496" y="478">Keys + relations</text>
    <line class="divider" x1="452" y1="501" x2="748" y2="501"/>
    <text class="key" x="456" y="530">SITE_ENTITY_KEY</text>
    <text class="key" x="456" y="556">INVESTIGATION_KEY</text>
    <text class="key" x="456" y="582">GEOMETRY_GROUP_KEY</text>
    <text class="key" x="456" y="608">NUMBER_KEY</text>
    <text class="relation" x="456" y="640">identity / parent–child</text>
    <text class="relation" x="456" y="668">investigation / boundary</text>
  </g>

  <path class="arrow" d="M 418 560 H 387"/>

  <g id="stage-6">
    <rect class="card-output" x="35" y="435" width="340" height="250" rx="8"/>
    <circle class="step" cx="67" cy="470" r="22"/>
    <text class="step-text" x="67" y="471">6</text>
    <text class="heading" x="101" y="478">Auditable outputs</text>
    <line class="divider" x1="57" y1="501" x2="353" y2="501"/>
    <text class="body" x="61" y="538">separate geometry layers</text>
    <text class="body" x="61" y="574">representative map labels</text>
    <text class="body" x="61" y="610">preserved records + audit</text>
    <text class="body" x="61" y="646">manifest + content hashes</text>
  </g>

  <rect class="footer" x="175" y="720" width="850" height="46" rx="6"/>
  <text class="footer-text" x="600" y="749">Sources stay unchanged; recommendations and decisions stay traceable.</text>
</svg>
